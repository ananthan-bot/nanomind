[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nanomind"
version = "0.1.0"
description = "A small GPT-style transformer LLM built from scratch in PyTorch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ananthan-bot" }]
keywords = ["llm", "transformer", "gpt", "language-model", "pytorch", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.0",
    "matplotlib>=3.8",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
nanomind-train    = "nanomind.cli.train:main"
nanomind-generate = "nanomind.cli.generate:main"
nanomind-eval     = "nanomind.cli.eval:main"
nanomind-info     = "nanomind.cli.info:main"

[project.urls]
Homepage   = "https://github.com/ananthan-bot/nanomind"
Repository = "https://github.com/ananthan-bot/nanomind"
Issues     = "https://github.com/ananthan-bot/nanomind/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanomind*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]
ignore  = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["nanomind"]

# ── Black  (formatter — keep consistent with ruff-format) ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short --cov=nanomind --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["nanomind"]
omit   = ["tests/*", "*/__init__.py"]
