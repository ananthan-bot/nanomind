# NanoMind — Medium model config (~12M params, GPU recommended)
model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  block_size: 256
  dropout: 0.1

train:
  batch_size: 64
  max_iters: 10000
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_iters: 200
  grad_clip: 1.0
  eval_interval: 500
  device: auto
