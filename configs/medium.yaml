# NanoMind medium model configuration
# ~85M parameters — GPT-2 small scale

run_name: nanomind_medium

model:
  vocab_size: 50257
  block_size: 1024
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_ff: null           # defaults to 4 * d_model = 3072
  dropout: 0.1
  norm_type: layernorm
  activation: gelu
  norm_placement: pre
  bias: false
  weight_tying: true

train:
  max_iters: 100000
  eval_interval: 1000
  eval_iters: 100
  log_interval: 100
  grad_accum_steps: 8
  grad_clip: 1.0
  use_amp: true
  early_stop_patience: 10
  seed: 42
  device: auto
  out_dir: checkpoints/medium

checkpoint:
  out_dir: checkpoints/medium
  save_interval: 2000
  keep_last_n: 3
  save_best: true
  save_optimizer: true

generate:
  max_new_tokens: 500
  strategy: top_p
  temperature: 0.9
  top_k: 0
  top_p: 0.95
  repetition_penalty: 1.1
