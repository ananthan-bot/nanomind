# NanoMind Mixtral-inspired MoE configuration
# Sliding Window Attention + RoPE + 8 experts top-2 + RMSNorm + SwiGLU

run_name: nanomind_mixtral_moe

model:
  vocab_size: 32000
  block_size: 512
  d_model: 256
  n_layers: 8
  n_heads: 8
  n_kv_heads: 2         # GQA 4:1
  window_size: 128      # SWA
  dropout: 0.0
  norm_type: rmsnorm
  pos_type: swa_rope
  weight_tying: false
  bias: false

moe:
  num_experts: 8
  top_k: 2
  load_balance_coef: 0.01
  expert_dropout: 0.0
  d_ff_expert: null     # defaults to 4 x d_model
  activation: swiglu

train:
  max_iters: 25000
  eval_interval: 500
  grad_clip: 1.0
  use_amp: false
  device: auto
  out_dir: checkpoints/mixtral_moe
