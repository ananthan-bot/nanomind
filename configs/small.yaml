# NanoMind — Small model config (~1M params, fast CPU training)
data:
  tokenizer: char
  block_size: 128
  batch_size: 32
  val_fraction: 0.1

model:
  d_model: 128
  n_layers: 4
  n_heads: 4
  block_size: 128
  dropout: 0.1

train:
  max_iters: 5000
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_iters: 100
  grad_clip: 1.0
  eval_interval: 200
  device: auto
