# NanoMind Mistral-inspired SWA configuration
# Sliding Window Attention + RoPE + RMSNorm + SwiGLU

run_name: nanomind_mistral_swa

model:
  vocab_size: 32000
  block_size: 512
  d_model: 256
  n_layers: 6
  n_heads: 8
  n_kv_heads: 2         # GQA: 4:1 ratio
  window_size: 128      # each token sees last 128 tokens only
  dropout: 0.0
  norm_type: rmsnorm
  activation: swiglu
  norm_placement: pre
  pos_type: swa_rope    # Sliding Window + RoPE
  weight_tying: false
  bias: false

train:
  max_iters: 20000
  eval_interval: 500
  grad_clip: 1.0
  use_amp: false
  device: auto
  out_dir: checkpoints/mistral_swa

generate:
  max_new_tokens: 200
  strategy: top_p
  temperature: 0.8
  top_p: 0.95
